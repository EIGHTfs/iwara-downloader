<div class="card">
      <h2>修改密码</h2>
      <p class="hint">已设过密码时需先填旧密码；首次设置可留空。</p>
      <div class="row">
        <input type="password" id="oldPwd" placeholder="旧密码（已设密码时必填）" style="flex:1">
      </div>
      <div class="row mt">
        <input type="password" id="newPwd" placeholder="新密码（至少 4 位）" style="flex:1">
        <button class="primary" id="changePwdBtn" type="button">修改</button>
      </div>
      <div class="status" id="pwdStatus"></div>
    </div>
