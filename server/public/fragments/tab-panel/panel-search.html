  <!-- ============ 搜索 ============ -->
  <div class="tab-panel" id="panel-search">
    <div class="card">
      <h2>搜索视频</h2>
      <p class="hint">关键词搜索对齐官网。默认视频：<code>/search?type=videos&amp;query=&amp;sort=date</code>。选作者：<code>/search?type=users&amp;query=&amp;sort=relevance</code>，此时才加载关注列表，并复用同一个关键词框。关键词与按时间搜索的结果都显示在下方「搜索结果」里。</p>
      <div class="row">
        <label><input type="checkbox" id="filterNormal" checked> 普通</label>
        <label><input type="checkbox" id="filterNsfw" checked> R18</label>
      </div>
      <div class="row mt">
        <label>类型
          <select id="kwType">
            <option value="videos" selected>视频</option>
            <option value="users">作者</option>
          </select>
        </label>
        <div style="position:relative;flex:1;min-width:220px">
          <label>关键词
            <input type="text" id="kwInput" placeholder="输入关键词" style="width:100%;min-width:220px" autocomplete="off">
          </label>
          <div class="combo-list" id="kwUserCombo" style="display:none"></div>
        </div>
        <button class="primary" id="kwSearchBtn" type="button">关键词搜索</button>
      </div>
      <div class="status" id="kwStatus"></div>
      <div class="row mt">
        <label>开始日期 <input type="date" id="searchStart"></label>
        <button class="ghost" id="earliestBtn" type="button" title="设为最早（2000-01-01）">最早</button>
        <label>结束日期 <input type="date" id="searchEnd"></label>
        <button class="primary" id="searchBtn" type="button">按时间搜索</button>
        <button class="ghost" id="stopSearchBtn" type="button" style="display:none">停止搜索</button>
      </div>
      <div class="status" id="searchStatus"></div>
    </div>
    <div class="card">
      <h2>搜索结果 <span id="resultCount" class="sub"></span></h2>
      <div class="row" style="margin-bottom:8px">
        <button class="primary" id="selectAllBtn" type="button" title="只勾选符合上方「普通/R18 筛选」的结果">全选</button>
        <button class="ghost" id="selectNoneBtn" type="button">全不选</button>
        <button class="success" id="downloadSelectedBtn" type="button">下载勾选项</button>
        <button class="ghost" id="saveSearchBtn" type="button" title="把当前搜索结果覆盖写入 search_cache.json">保存</button>
        <button class="ghost" id="clearSearchBtn" type="button">清空列表</button>
        <button class="ghost" id="exportSearchBtn" type="button" title="导出当前搜索结果记录为 JSON 文件">导出记录</button>
        <button class="ghost" id="importSearchBtn" type="button" title="上传 JSON 文件导入搜索记录（按 id 合并）">导入记录</button>
        <input type="file" id="importSearchFile" accept=".json,application/json" style="display:none">
      </div>
      <div class="result-list" id="searchResultList"><div class="empty">尚未搜索</div></div>
    </div>
  </div>
