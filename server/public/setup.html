<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<title><!-- @brand:title --> · 首次设置</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <h1><img src="@brand:logo@" alt="@brand:title@" style="height:26px;vertical-align:middle"></h1><!-- dsh-skip-residue -->
  <div class="card">
    <h2>首次设置</h2>
    <p class="hint">服务器尚未设置访问密码。请设置一个密码（至少 4 位），之后访问所有页面都需要登录。</p>
    <input type="password" id="pwd" placeholder="设置访问密码">
    <input type="password" id="pwd2" placeholder="再次输入确认">
    <button class="primary" id="btn">设置密码并进入</button>
    <div class="status" id="status"></div>
  </div>
</div>
<script src="setup-init.js"></script>
</body>
</html>
