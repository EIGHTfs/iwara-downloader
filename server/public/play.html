<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/iwara-logo.png?v=2">
<title>本地播放 · iwara-downloader</title>
<link rel="stylesheet" href="style.css">
<script src="theme-init.js"></script>
<style>
/* ═══ 播放页布局 ═══ */
/* header 不用 sticky，播放页独占全屏 */
.play-body header { position: static; }
.play-body .player-page {
  display: flex;
  gap: 16px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
  height: calc(100vh - 64px);
  overflow: hidden;
}
.player-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.player-stage {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  flex: 1 1 auto;
  min-height: 360px;
  position: relative;
}
.player-stage #player,
.player-stage .art-video-player,
.player-stage .art-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.player-meta {
  margin-top: 12px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  flex-shrink: 0;
}
.player-meta h1 { margin: 0 0 8px; font-size: 18px; word-break: break-all; }
.player-author { color: var(--muted); margin-bottom: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.player-author a { color: var(--primary); text-decoration: none; }
.player-author .author-avatar {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  background: var(--card2); border: 1px solid var(--border);
}
/* 播放页「收藏 / 关注」按钮：与搜索列表 badge 一致的正向/正向态 */
.player-state-btns { display: inline-flex; gap: 6px; margin-left: auto; }
.player-state-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 999px; padding: 2px 12px; font-size: 12px; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.player-state-btn:hover { border-color: var(--primary); color: var(--primary); }
.player-state-btn.on {
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  border-color: color-mix(in srgb, var(--primary) 50%, transparent);
  color: var(--primary); font-weight: 600;
}
.player-state-btn:disabled { opacity: .5; cursor: default; }
.player-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.player-tags span {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 10px; font-size: 12px;
}
.player-extra { color: var(--muted); font-size: 12px; }
.player-err { color: var(--fail); margin-top: 8px; font-size: 13px; }
/* 右侧播放列表 */
.player-sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.sidebar-header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card2);
}
.sidebar-header .count { font-size: 12px; color: var(--muted); font-weight: normal; }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.playlist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background .15s; margin-bottom: 4px;
}
.playlist-item:hover { background: var(--card2); }
.playlist-item.active {
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  outline: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
}
.playlist-item .thumb {
  width: 80px; height: 45px; object-fit: cover;
  border-radius: 4px; background: var(--border); flex-shrink: 0;
}
.playlist-item .info { flex: 1; min-width: 0; }
.playlist-item .title {
  font-size: 13px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; color: var(--text);
}
.playlist-item.active .title { color: var(--primary); }
.playlist-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sidebar-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 13px; }
/* 播放列表工具条：排序切换 + 自动连播开关 */
.sidebar-tools {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; border-bottom: 1px solid var(--border);
}
.tool-btn {
  background: none; border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
}
.tool-btn:hover { border-color: var(--primary); color: var(--primary); }
.tool-dir { min-width: 58px; text-align: center; }
/* 排序维度互斥按钮（分段控件） */
.sort-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.sort-seg-btn {
  background: none; border: none; color: var(--muted);
  padding: 3px 10px; font-size: 12px; cursor: pointer;
}
.sort-seg-btn + .sort-seg-btn { border-left: 1px solid var(--border); }
.sort-seg-btn.active {
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  color: var(--primary); font-weight: 600;
}
.tool-toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.tool-toggle input { accent-color: var(--primary); cursor: pointer; }
/* 文件夹分组：组标题可折叠 */
.playlist-group-header {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; margin-top: 4px; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--primary);
  background: color-mix(in srgb, var(--primary) 6%, transparent);
  border-radius: 6px; user-select: none;
}
.playlist-group-header .arrow { font-size: 10px; transition: transform .12s; }
.playlist-group-header.collapsed .arrow { transform: rotate(-90deg); }
.playlist-group-header .gcount { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 11px; }
.playlist-group-body { display: block; }
.playlist-group-header.collapsed + .playlist-group-body { display: none; }
.loading-more {
  padding: 12px; text-align: center; color: var(--muted);
  font-size: 12px; border-top: 1px solid var(--border); cursor: pointer;
}
.loading-more:hover { color: var(--primary); }
@media (max-width: 900px) {
  .play-body { overflow-x: hidden; }
  .play-body header {
    padding: 8px 12px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    gap: 8px;
  }
  .play-body .brand-title { font-size: 11px; line-height: 1.15; }
  .play-body .brand-block .brand-logo { width: 32px; height: 32px; }
  .play-body header .ghost { padding: 6px 10px; font-size: 13px; }
  .play-body .player-page {
    flex-direction: column;
    height: auto;
    min-height: calc(100dvh - 56px);
    overflow: visible;
    gap: 10px;
    padding: 10px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
  }
  .player-main { overflow: visible; }
  .player-stage {
    flex: none;
    width: 100%;
    min-height: 0;
    height: auto;
    aspect-ratio: 16 / 9;
    max-height: 56dvh;
    border-radius: 8px;
  }
  .player-meta { margin-top: 8px; padding: 10px 12px; }
  .player-meta h1 { font-size: 16px; }
  .player-sidebar {
    width: 100%;
    max-height: none;
    min-height: 240px;
    height: min(52dvh, 480px);
  }
  .playlist-item { padding: 10px; min-height: 44px; }
  .playlist-item .thumb { width: 96px; height: 54px; }
  .playlist-item .title { font-size: 14px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
}
@media (max-width: 900px) and (orientation: landscape) {
  .play-body header { display: none; }
  .play-body .player-page {
    flex-direction: row;
    height: 100dvh;
    min-height: 100dvh;
    padding: 6px;
    gap: 8px;
    overflow: hidden;
  }
  .player-stage {
    aspect-ratio: auto;
    height: 100%;
    max-height: none;
    flex: 1;
  }
  .player-meta { display: none; }
  .player-sidebar {
    width: min(280px, 38vw);
    height: 100%;
    min-height: 0;
  }
}
</style>
</head>
<body class="play-body">
<!-- ═══ 顶部导航栏（播放页不 sticky） ═══ -->
<header>
  <div class="brand-block">
    <a href="/" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <img src="iwara-logo.png" alt="Iwara" class="brand-logo">
      <h1 class="brand-title">Iwara<br>Video<br>Downloader</h1>
    </a>
  </div>
  <div class="right">
    <a class="ghost" href="/">返回进度</a>
    <button class="ghost" id="themeBtn" type="button" title="切换白天/夜间模式">🌙 夜间</button>
  </div>
</header>

<!-- ═══ 播放页主体 ═══ -->
<div class="player-page">
  <div class="player-main">
    <div class="player-stage"><div id="player"></div></div>
    <div class="player-meta">
      <h1 id="title">加载中…</h1>
      <div class="player-author"><span id="author"></span>
        <span class="player-state-btns">
          <button class="player-state-btn" id="likeBtn" type="button" data-on="false">❤️ 点赞</button>
          <button class="player-state-btn" id="followBtn" type="button" data-on="false">+ 关注</button>
        </span>
      </div>
      <div class="player-tags" id="tags"></div>
      <div class="player-extra" id="extra"></div>
      <div class="player-err" id="err"></div>
    </div>
  </div>
  <div class="player-sidebar">
    <div class="sidebar-header">
      <span>播放列表</span>
      <span class="count" id="listCount"></span>
    </div>
    <div class="sidebar-tools">
      <div class="sort-seg" id="sortSeg" title="排序维度（互斥选择）">
        <button class="sort-seg-btn active" data-sort="time" type="button">时间</button>
        <button class="sort-seg-btn" data-sort="name" type="button">名称</button>
      </div>
      <button class="tool-btn tool-dir" id="sortDirBtn" type="button" title="切换倒序/正序">↓ 倒序</button>
      <label class="tool-toggle" title="播完自动播放下一个视频">
        <input type="checkbox" id="autoplayNext" checked>
        <span>自动连播</span>
      </label>
    </div>
    <div class="sidebar-list" id="playlist">
      <div class="sidebar-empty">加载中…</div>
    </div>
    <div class="loading-more" id="loadingMore" style="display:none">加载更多</div>
  </div>
</div>

<script src="/vendor/artplayer.js"></script>
<script src="play-list.js"></script>
<script src="play-enhance.js"></script>
<script src="play-app.js"></script>
</body>
</html>
